<text class="m" x="70" y="826" font-size="12" letter-spacing="2.5" fill="var(--muted)">PROJECT PRINCIPLE</text>
<text class="m" x="70" y="864" font-size="17" fill="var(--ink)">A project earns space by demonstrating a useful engineering concept.</text>
