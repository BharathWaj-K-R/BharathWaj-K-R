<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current engineering status"><style>
:root{--bg:#fff;--ink:#111827;--muted:#475569;--rule:#cbd5e1;--panel:#f8fafc;--accent:#2563eb}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
.line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:6 8;animation:flow 1.7s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.in,.line,.flow,.pulse{animation:none}.in{opacity:1}.line{stroke-dashoffset:0}}
</style>
<rect width="1000" height="140" rx="8" fill="var(--bg)"/><rect x="18" y="14" width="964" height="112" rx="10" fill="none" stroke="var(--rule)" stroke-width="1.5"/>
<line x1="44" y1="44" x2="956" y2="44" stroke="var(--rule)"/>
<circle class="pulse" cx="64" cy="80" r="5" fill="var(--accent)"/><circle class="pulse" cx="64" cy="80" r="16" fill="none" stroke="var(--accent)" opacity=".25"/>
<text class="m in" x="88" y="78" font-size="13" letter-spacing="2.3" fill="var(--ink)">STATUS — BUILDING</text>
<text class="m in d1" x="88" y="99" font-size="11.5" letter-spacing="1.5" fill="var(--muted)">software engineering · backend · delivery</text>
<text class="m in d2" x="956" y="84" text-anchor="end" font-size="12" fill="var(--muted)">bharath-forgebuilds-tech.onrender.com</text></svg>