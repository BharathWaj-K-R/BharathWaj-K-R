<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 1000 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Engineering system map"><style>
:root{--bg:#0D1117;--ink:#F0F6FC;--muted:#8B949E;--rule:#30363D;--panel:#161B22;--accent:#58A6FF}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
.line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:6 8;animation:flow 1.7s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.in,.line,.flow,.pulse{animation:none}.in{opacity:1}.line{stroke-dashoffset:0}}
</style>
<rect width="1000" height="560" rx="8" fill="var(--bg)"/><rect x="18" y="14" width="964" height="532" rx="10" fill="none" stroke="var(--rule)" stroke-width="1.5"/>
<text class="m in" x="44" y="36" font-size="11" letter-spacing="3" fill="var(--muted)">02 — ENGINEERING MAP</text>
<text class="m in d1" x="950" y="36" text-anchor="end" font-size="10" letter-spacing="2" fill="var(--muted)">FOUNDATION → DELIVERY</text>
<line class="flow" x1="190" y1="190" x2="392" y2="132" stroke="var(--rule)"/><line class="flow" x1="190" y1="190" x2="392" y2="280" stroke="var(--rule)"/><line class="flow" x1="190" y1="190" x2="392" y2="428" stroke="var(--rule)"/>
<line class="flow" x1="608" y1="132" x2="760" y2="220" stroke="var(--rule)"/><line class="flow" x1="608" y1="280" x2="760" y2="220" stroke="var(--rule)"/><line class="flow" x1="608" y1="428" x2="760" y2="220" stroke="var(--rule)"/>
<g class="in d1"><rect x="54" y="145" width="136" height="90" rx="9" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="74" y="172" font-size="10.5" letter-spacing="1.5" fill="var(--muted)">FOUNDATION</text><text class="m" x="74" y="199" font-size="18" font-weight="700" fill="var(--ink)">Java / OOP</text><text class="m" x="74" y="219" font-size="12.5" fill="var(--muted)">Core concepts</text></g>
<g class="in d2"><rect x="392" y="84" width="216" height="96" rx="9" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="414" y="111" font-size="10.5" letter-spacing="1.5" fill="var(--muted)">PROBLEM SOLVING</text><text class="m" x="414" y="140" font-size="18" font-weight="700" fill="var(--ink)">DSA / Algorithms</text><text class="m" x="414" y="162" font-size="12.5" fill="var(--muted)">Arrays · Hashing · Strings</text></g>
<g class="in d3"><rect x="392" y="232" width="216" height="96" rx="9" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="414" y="259" font-size="10.5" letter-spacing="1.5" fill="var(--muted)">BACKEND</text><text class="m" x="414" y="288" font-size="18" font-weight="700" fill="var(--ink)">SQL / Spring Boot</text><text class="m" x="414" y="310" font-size="12.5" fill="var(--muted)">APIs · DBMS</text></g>
<g class="in d4"><rect x="392" y="380" width="216" height="96" rx="9" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="414" y="407" font-size="10.5" letter-spacing="1.5" fill="var(--muted)">DELIVERY</text><text class="m" x="414" y="436" font-size="18" font-weight="700" fill="var(--ink)">Linux / Docker</text><text class="m" x="414" y="458" font-size="12.5" fill="var(--muted)">Git · Deployment</text></g>
<g class="in d5"><rect x="760" y="168" width="186" height="104" rx="9" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="782" y="197" font-size="10.5" letter-spacing="1.5" fill="var(--muted)">BUILD OUTPUT</text><text class="m" x="782" y="226" font-size="18" font-weight="700" fill="var(--ink)">Working software</text><text class="m" x="782" y="248" font-size="12.5" fill="var(--muted)">Projects · APIs · Deployments</text></g>
<g class="in d6"><rect x="760" y="316" width="186" height="92" rx="9" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.5"/><text class="m" x="782" y="345" font-size="10.5" letter-spacing="1.5" fill="var(--accent)">NEXT LAYER</text><text class="m" x="782" y="374" font-size="18" font-weight="700" fill="var(--ink)">Backend + AI</text><text class="m" x="782" y="396" font-size="12.5" fill="var(--muted)">Practical systems</text></g>
<text class="m in d6" x="50" y="514" font-size="11" letter-spacing="2" fill="var(--muted)">THE GOAL: TURN KNOWLEDGE INTO SYSTEMS THAT CAN BE TESTED, DEBUGGED, AND DEPLOYED.</text></svg>