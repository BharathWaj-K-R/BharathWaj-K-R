<?xml version="1.0" encoding="UTF-8"?><svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack"><style>
:root{--bg:#0D1117;--ink:#F0F6FC;--muted:#8B949E;--rule:#30363D;--panel:#161B22;--accent:#58A6FF}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.in{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}.d6{animation-delay:.58s}
.line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}.pulse{animation:pulse 2s ease-in-out infinite}.flow{stroke-dasharray:6 8;animation:flow 1.7s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-28}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.in,.line,.flow,.pulse{animation:none}.in{opacity:1}.line{stroke-dashoffset:0}}
</style>
<rect width="1000" height="330" rx="8" fill="var(--bg)"/><rect x="18" y="14" width="964" height="302" rx="10" fill="none" stroke="var(--rule)" stroke-width="1.5"/>
<text class="m in" x="44" y="36" font-size="11" letter-spacing="3" fill="var(--muted)">06 — STACK</text>
<g class="in d1"><rect x="44" y="64" width="912" height="36" rx="8" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="64" y="88" font-size="10.5" letter-spacing="2" fill="var(--muted)">LANGUAGES</text><text class="m" x="206" y="88" font-size="14.5" font-weight="700" fill="var(--ink)">Java · C++ · Python</text></g><g class="in d2"><rect x="44" y="111" width="912" height="36" rx="8" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="64" y="135" font-size="10.5" letter-spacing="2" fill="var(--muted)">BACKEND</text><text class="m" x="206" y="135" font-size="14.5" font-weight="700" fill="var(--ink)">Spring Boot · FastAPI · SQL · DBMS</text></g><g class="in d3"><rect x="44" y="158" width="912" height="36" rx="8" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="64" y="182" font-size="10.5" letter-spacing="2" fill="var(--muted)">AI</text><text class="m" x="206" y="182" font-size="14.5" font-weight="700" fill="var(--ink)">Generative AI · RAG · AI-assisted tooling</text></g><g class="in d4"><rect x="44" y="205" width="912" height="36" rx="8" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="64" y="229" font-size="10.5" letter-spacing="2" fill="var(--muted)">DELIVERY</text><text class="m" x="206" y="229" font-size="14.5" font-weight="700" fill="var(--ink)">Linux · Git/GitHub · Docker · Render</text></g><g class="in d5"><rect x="44" y="252" width="912" height="36" rx="8" fill="var(--panel)" stroke="var(--rule)"/><text class="m" x="64" y="276" font-size="10.5" letter-spacing="2" fill="var(--muted)">FRONTEND</text><text class="m" x="206" y="276" font-size="14.5" font-weight="700" fill="var(--ink)">HTML · CSS · JavaScript · React</text></g>
</svg>