<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Bharathwaj K R">
<style>
:root{--ink:#111;--muted:#4B5563;--rule:#AAB2BF;--accent:#2563EB}
@media(prefers-color-scheme:dark){:root{--ink:#F2F2F2;--muted:#999;--rule:#444;--accent:#60A5FA}}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.r{opacity:0;animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.a1{animation-delay:.1s}.a2{animation-delay:.25s}.a3{animation-delay:.4s}.a4{animation-delay:.55s}.a5{animation-delay:.7s}
@media(prefers-reduced-motion:reduce){.r{animation:none;opacity:1}}
</style>
<line x1="48" y1="34" x2="952" y2="34" stroke="var(--rule)"/>
<text class="m r a1" x="48" y="24" font-size="11" letter-spacing="3" fill="var(--muted)">01 — WHOAMI</text>
<text class="m r a1" x="952" y="24" font-size="11" letter-spacing="3" text-anchor="end" fill="var(--muted)">PROFILE NOTE</text>
<text class="m r a2" x="48" y="72" font-size="19" fill="var(--ink)">Engineering student building toward software engineering roles.</text>
<text class="m r a3" x="48" y="101" font-size="17" fill="var(--muted)">Focused on programming fundamentals, problem solving, backend systems, and delivery.</text>
<line class="r a3" x1="48" y1="126" x2="952" y2="126" stroke="var(--rule)" opacity=".7"/>
<text class="m r a4" x="48" y="158" font-size="11" letter-spacing="2.5" fill="var(--muted)">FOCUS</text>
<text class="m r a4" x="144" y="158" font-size="16" fill="var(--ink)">Java · DSA · SQL / DBMS · Spring Boot · Linux · Docker</text>
<text class="m r a5" x="48" y="192" font-size="11" letter-spacing="2.5" fill="var(--muted)">METHOD</text>
<text class="m r a5" x="144" y="192" font-size="16" fill="var(--ink)">Understand → Implement → Test → Debug → Improve → Ship</text>
<text class="m r a5" x="48" y="232" font-size="13" fill="var(--muted)">Building projects to turn concepts into working software.</text>
</svg>