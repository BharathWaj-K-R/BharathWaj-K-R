<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bharathwaj K R — Software Engineer">
<style>
:root{--ink:#111111;--muted:#4B5563;--rule:#AAB2BF;--soft:#F5F5F5;--accent:#111111}
@media(prefers-color-scheme:dark){:root{--ink:#F2F2F2;--muted:#999999;--rule:#444444;--soft:#171717;--accent:#FFFFFF}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fade{opacity:0;animation:fade .8s ease forwards}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.5s ease forwards}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.spin{transform-origin:820px 208px;animation:spin 14s linear infinite}
@keyframes fade{to{opacity:1}} @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}} @keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}} @keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.fade,.rise,.draw,.pulse,.spin{animation:none}.fade,.rise{opacity:1}.draw{stroke-dashoffset:0}}
</style>
<rect width="1000" height="330" rx="6" fill="var(--soft)" opacity=".75"/>
<line class="draw" x1="40" y1="42" x2="960" y2="42" stroke="var(--rule)"/>
<text class="mono fade" x="40" y="28" font-size="11" letter-spacing="3" fill="var(--muted)">PORTFOLIO / INDEX 001</text>
<text class="mono fade" x="960" y="28" font-size="11" letter-spacing="3" text-anchor="end" fill="var(--muted)">CHENNAI, INDIA</text>

<text class="mono rise" x="40" y="125" font-size="62" letter-spacing="-2" fill="var(--ink)">Bharathwaj K R</text>
<text class="mono rise" x="42" y="157" font-size="20" fill="var(--muted)">Aspiring Software Engineer — Java, DSA, Backend &amp; DevOps.</text>
<text class="mono fade" x="42" y="189" font-size="15" fill="var(--muted)">building strong fundamentals and turning them into working software.</text>

<g class="fade">
<rect x="700" y="93" width="220" height="132" rx="4" fill="none" stroke="var(--rule)"/>
<line x1="700" y1="125" x2="920" y2="125" stroke="var(--rule)"/>
<circle cx="720" cy="109" r="3" fill="var(--muted)"/>
<circle cx="733" cy="109" r="3" fill="var(--muted)"/>
<circle cx="746" cy="109" r="3" fill="var(--muted)"/>
<text class="mono" x="716" y="151" font-size="13" fill="var(--muted)">$ focus --on</text>
<text class="mono" x="716" y="170" font-size="14" fill="var(--ink)">engineering</text>
<text class="mono" x="716" y="189" font-size="14" fill="var(--ink)">backend</text>
<text class="mono" x="716" y="208" font-size="14" fill="var(--ink)">delivery</text>
<rect class="pulse" x="866" y="196" width="7" height="14" fill="var(--ink)"/>
</g>

<g class="spin" opacity=".18">
<circle cx="820" cy="208" r="53" stroke="var(--rule)"/>
<circle cx="820" cy="208" r="67" stroke="var(--rule)" stroke-dasharray="3 8"/>
</g>

<line class="draw" x1="40" y1="265" x2="960" y2="265" stroke="var(--rule)"/>
<text class="mono fade" x="40" y="289" font-size="11" letter-spacing="2" fill="var(--muted)">JAVA · DSA · SQL · SPRING BOOT · LINUX · GIT · DOCKER</text>
</svg>